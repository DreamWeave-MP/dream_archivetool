manifest_version = 1

[package]
id = "org.dreamweave.dream-archivetool"
version = "0.1.0"
jess_api = "1"
default_target = "dream-archivetool"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/commands.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.dream-archive" = "0.1"

[modules]
"@dream-archivetool" = "src/init.jsl"
"@dream-archivetool/commands" = "src/commands.jsl"
"@dream-archivetool/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. The library and its commands open archives and read the files
# they pack, and write what they extract and build, so their caller needs to read and write
# files.

[[layer]]
id = "dream-archivetool.core"
requires = ["dream-archive.core"]
exports = ["@dream-archivetool", "@dream-archivetool/commands", "@dream-archivetool/cli"]

# The command line: `src/main.jsl` hands its arguments to `@dream-archivetool/cli`. A command
# opens the archives it is given, looks for the targets an extraction would write, and walks,
# resolves, and reads the files `create` and `add` pack (filesystem.read); `extract`,
# `extract-all`, `create`, and `add` make folders, write each file beside its target, and rename
# it into place (filesystem.write). It reads no environment, runs no other program, and opens no
# connection.

[targets.dream-archivetool]
kind = "command"
command = "dream-archivetool"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.stdio"]
