base_url = "https://dreamweave-mp.github.io/dream_archivetool"
title = "dream-archivetool"
description = "Inspects, extracts, creates and updates Bethesda BSA and BA2 archives over dream-archive, as a Jess package and command in Luau."
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "dream_archivetool"
logo_text = "dream-archivetool"
palette = "gold"
menu_items = [
    { name = "dream-archivetool", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

[extra.comments]
enabled = false
category = "General"
