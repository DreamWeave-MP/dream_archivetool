# dream-archivetool as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `dream_archivetool-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "29471f23-7ed9-43b9-b222-bcc597335ab5"
slug = "dream_archivetool"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.dream-archivetool"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
