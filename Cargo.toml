[package]
name = "dream_archivetool"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Inspect, extract, create, and update Bethesda BSA and BA2 archives"
license = "GPL-3.0-or-later"
repository = "https://github.com/DreamWeave-MP/dream_archivetool"
documentation = "https://dreamweave-mp.github.io/dream_archivetool/dream_archivetool/index.html"
readme = "README.md"
keywords = ["bethesda", "bsa", "ba2", "archive", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
dream_archive = { version = "0.3.0", path = "../dream_archive" }
l3i = { path = "../dream-binder", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
clap_mangen = { version = "0.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
tempfile = "3.27"
thiserror = "2.0"
walkdir = "2.5"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:serde_json"]
# The l3i extension (`dream_archivetool::luau`); `lua` is the old name of the same feature.
luau = ["dep:l3i", "dream_archive/luau"]
lua = ["luau"]

[package.metadata.docs.rs]
features = ["luau"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
l3i = { path = "../dream-binder", features = ["analysis"] }

[[bench]]
name = "archive_ops"
harness = false

[[bin]]
name = "dream_archivetool"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "luau_boundary"
harness = false
required-features = ["luau"]

[[test]]
name = "luau_api"
required-features = ["luau"]
