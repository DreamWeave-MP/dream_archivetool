[package]
name = "dream-archivetool"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Inspect, extract, create, and update Bethesda BSA and BA2 archives"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["bethesda", "bsa", "ba2", "archive", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
dream_archive = "0.1.1"
dream-path = "0.1.2"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
mlua = { version = "0.11.6", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tempfile = "3"
thiserror = "2"
walkdir = "2"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:serde_json"]
lua = ["dep:mlua", "dream-path/lua"]
standalone-lua = ["lua", "mlua/luajit52", "mlua/vendored"]

[package.metadata.docs.rs]
features = ["standalone-lua"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "archive_ops"
harness = false

[[bin]]
name = "dream-archivetool"
path = "src/main.rs"
required-features = ["cli"]
