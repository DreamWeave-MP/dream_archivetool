[package]
name = "rome-archivetool"
version = "0.1.0"
edition = "2024"
description = "Inspect, extract, create, and update Bethesda BSA and BA2 archives"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["bethesda", "bsa", "ba2", "archive", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ba2 = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
mlua = { version = "0.10", optional = true, features = ["luajit52", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[features]
lua = ["dep:mlua"]
