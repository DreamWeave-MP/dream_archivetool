[package]
name = "dream_archivetool"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Inspect, extract, create, and update Bethesda BSA and BA2 archives"
license = "GPL-3.0-or-later"
repository = "https://github.com/DreamWeave-MP/dream_archivetool"
documentation = "https://dreamweave-mp.github.io/dream_archivetool/dream_archivetool/index.html"
readme = "README.md"
keywords = ["bethesda", "bsa", "ba2", "archive", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
dream_archive = "0.2.2"
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
clap_mangen = { version = "0.3", optional = true }
mlua = { version = "0.12.1", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
tempfile = "3.27"
thiserror = "2.0"
walkdir = "2.5"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:serde_json"]
lua = ["dep:mlua", "dream_archive/lua"]
standalone-lua = ["lua", "mlua/luau"]

[package.metadata.docs.rs]
features = ["standalone-lua"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "archive_ops"
harness = false

[[bin]]
name = "dream_archivetool"
path = "src/main.rs"
required-features = ["cli"]
